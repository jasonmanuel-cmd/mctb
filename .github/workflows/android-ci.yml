name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs in seconds and needs no JDK. Catches unresolved resources, phantom
  # manifest components, missing permission declarations and the DataStore
  # collect{} deadlock before a 5-minute Gradle build discovers them.
  static-gate:
    name: Static consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run project checks
        run: python3 tools/check_project.py

  build-and-test:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    needs: static-gate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile debug + run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

      # Lint reports are useful but should not block a push, especially while
      # the project is still settling.
      - name: Lint (non-blocking)
        if: always()
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      # Proves the release variant builds too. Unsigned unless the keystore
      # properties are supplied, which they are not in CI.
      - name: Compile release (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            app/build/outputs/apk/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
